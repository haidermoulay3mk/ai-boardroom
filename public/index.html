<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Boardroom</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="rail" id="rail">
      <div class="rail-top">
        <a class="brand" href="#/" aria-label="Boardroom home">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <ellipse cx="20" cy="20" rx="9" ry="13" fill="currentColor" opacity=".9"/>
            <circle cx="20" cy="3.5" r="2.6" fill="var(--brass)"/>
            <circle cx="33" cy="12" r="2.2" fill="currentColor"/>
            <circle cx="34" cy="26" r="2.2" fill="currentColor"/>
            <circle cx="7" cy="12" r="2.2" fill="currentColor"/>
            <circle cx="6" cy="26" r="2.2" fill="currentColor"/>
            <circle cx="20" cy="36.5" r="2.6" fill="var(--brass)"/>
          </svg>
          <span class="brand-name">Boardroom</span>
        </a>
        <button class="rail-toggle" id="railToggle" type="button" aria-expanded="false" aria-controls="railBody">Minutes</button>
      </div>
      <div class="rail-body" id="railBody">
        <a class="btn btn-primary btn-block" href="#/">New decision</a>
        <div class="rail-label">Minutes</div>
        <nav class="history" id="history" aria-label="Past sessions"></nav>
        <div class="rail-foot">
          <span class="engine-badge" id="engineBadge"></span>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9A7 7 0 0 1 12 3z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <div class="toasts" aria-live="polite"></div>
</body>
</html>
